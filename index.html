<!DOCTYPE html>
<html lang="en">
<head>
		<link rel="icon" type="image/png" href="Rotating_earth_animated.png">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Countdown to the end of the world. Watch a thrilling and stunning 3D animation of the apocalypse and the ultimate destruction of this blue planet.">
		<meta name="robots" content="index, follow">
		<meta name="author" content="Imam">
		<title>Iqtiraab</title>

		<!-- ফেসবুক ও লিংকডইন শেয়ারিং (Open Graph Tags) -->
		<meta property="og:title" content="Iqtiraab - Ultimate World Countdown">
		<meta property="og:description" content="Countdown to the end of the world. Watch a thrilling and stunning 3D animation of the apocalypse.">
		<meta property="og:image" content="https://iqtiraab.github.io">
		<meta property="og:url" content="https://iqtiraab.github.io">
		<meta property="og:type" content="https://iqtiraab.github.io">

		<!-- টুইটার বা এক্স শেয়ারিং (Twitter Card Tags) -->
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="Iqtiraab - Ultimate World Countdown">
		<meta name="twitter:description" content="Countdown to the end of the world. Watch a thrilling and stunning 3D animation of the apocalypse.">
		<meta name="twitter:image" content="https://iqtiraab.github.io">

		<!-- ক্যানোনিকাল লিংক -->
		<link rel="canonical" href="https://iqtiraab.github.io">
		
		<!-- CSS ফাইল লিঙ্ক করার লাইন -->
		<link rel="stylesheet" href="style.css">
</head>
<body id="main-body">

    <div class="container">
        <div class="fuse" id="fuse-element">
            <img class="fire" id="fire-element" src="spark.gif" alt="Spark Fire">
        </div>

        <div class="earth-wrapper" id="earth-wrapper-element">
            <img class="earth-gif" src="6.47MBRotating_earth_animated.gif" alt="Rotating Earth">
            <div class="clock" id="digital-clock">
                <div class="clock-time" id="clock-time-element">00.00.00 PM</div>
                <div class="clock-date" id="clock-date-element">Wednesday, July 15, 2026</div>
            </div>
        </div>

        <div class="shattered-earth" id="shattered-container">
            <div class="piece p1"></div>
            <div class="piece p2"></div>
            <div class="piece p3"></div>
            <div class="piece p4"></div>
            <div class="piece p5"></div>
            <div class="piece p6"></div>
            <div class="piece p7"></div>
        </div>

        <div class="explosion" id="explosion-element"></div>
    </div>

    <button class="restart-btn" id="restart-btn" onclick="resetBomb()">Start over.</button>

    <!-- JS ফাইল লিঙ্ক করার লাইন -->
    <script src="script.js"></script>
</body>
</html>
